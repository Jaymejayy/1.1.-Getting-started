apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todo-app:5.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: image-cache
              mountPath: /app/cache

      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: shared-data-claim
